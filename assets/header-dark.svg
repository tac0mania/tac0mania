<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Rohit Kumar, software engineer">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .bit { animation: rise 6s linear infinite; opacity: 0; }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .55; } 100% { transform: translateY(-120px); opacity: 0; } }
    .b2 { animation-delay: 1.5s; } .b3 { animation-delay: 3s; } .b4 { animation-delay: 4.5s; }
    .float { animation: bob 4s ease-in-out infinite; transform-origin: 950px 190px; }
    @keyframes bob { 50% { transform: translateY(-6px) rotate(-2deg); } }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset=".55" stop-color="#0d1117" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="318" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#0d1117"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#fade)"/>

    <!-- window chrome -->
    <circle cx="36" cy="34" r="6" fill="#ff5f57"/>
    <circle cx="56" cy="34" r="6" fill="#febc2e"/>
    <circle cx="76" cy="34" r="6" fill="#28c840"/>
    <text x="100" y="39" class="mono" font-size="14" fill="#8b949e">~/tac0mania</text>

    <!-- name block -->
    <text x="64" y="132" class="sans" font-size="64" font-weight="700" fill="#e6edf3" letter-spacing="-1.5">Rohit Kumar</text>
    <text x="66" y="174" class="sans" font-size="22" fill="#8b949e">Software engineer · full-stack · GenAI · systems</text>

    <text x="66" y="236" class="mono" font-size="19" fill="#7ee787">❯</text>
    <text x="90" y="236" class="mono" font-size="19" fill="#e6edf3">building unsexy but highly effective utilities</text>
    <rect x="626" y="220" width="11" height="21" fill="#f0a020" class="cursor"/>

    <text x="66" y="284" class="mono" font-size="14" fill="#8b949e">Dubai  ·  taco-man.in</text>

    <!-- bits escaping the taco -->
    <g class="mono" font-size="14" fill="#f0a020">
      <text x="890" y="150" class="bit">01</text>
      <text x="948" y="140" class="bit b2">1</text>
      <text x="1000" y="150" class="bit b3">10</text>
      <text x="925" y="146" class="bit b4">0</text>
    </g>

    <!-- taco -->
    <g class="float">
      <path d="M852 182 q12 -22 26 -6 q12 -24 28 -4 q14 -24 30 -4 q14 -24 30 -4 q14 -24 30 -4 q14 -22 26 6 z" fill="#3fb950"/>
      <circle cx="884" cy="176" r="11" fill="#f85149"/>
      <circle cx="944" cy="172" r="12" fill="#f85149"/>
      <circle cx="1008" cy="176" r="11" fill="#f85149"/>
      <rect x="908" y="170" width="16" height="10" rx="2" fill="#f5d547" transform="rotate(-18 916 175)"/>
      <rect x="970" y="168" width="16" height="10" rx="2" fill="#f5d547" transform="rotate(14 978 173)"/>
      <path d="M836 186 A114 114 0 0 0 1064 186 Z" fill="#e3a33b"/>
      <path d="M836 186 A114 114 0 0 0 1064 186" fill="none" stroke="#c77d1e" stroke-width="6"/>
      <path d="M862 186 A88 88 0 0 0 1038 186" fill="none" stroke="#c77d1e" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round" opacity=".7"/>
      <g fill="#a8641a" opacity=".55">
        <circle cx="900" cy="220" r="3"/><circle cx="940" cy="250" r="3"/><circle cx="985" cy="232" r="3"/>
        <circle cx="1020" cy="210" r="3"/><circle cx="870" cy="200" r="2.5"/><circle cx="960" cy="214" r="2.5"/>
        <circle cx="1005" cy="262" r="2.5"/><circle cx="915" cy="272" r="2.5"/>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="#30363d" stroke-width="2"/>
</svg>
